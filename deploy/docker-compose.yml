# Threshold on one server: the app, Postgres, Caddy for HTTPS, and nightly backups.
#   cp .env.production.example .env.production   # fill it in
#   docker compose up -d --build
# Run from this deploy/ directory.

name: threshold

services:
  db:
    image: mirror.gcr.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tms
      POSTGRES_USER: tms_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.production}
      # Passwords are checked on the socket too, not trusted. This only applies when the data
      # volume is first created; an existing database keeps its pg_hba.conf (see README).
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
    volumes:
      - db:/var/lib/postgresql/data
      # The app reaches Postgres through its socket, never a port: nothing else can connect.
      - db-socket:/var/run/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tms_app", "-d", "tms"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      DB_DRIVER: postgres
      DB_HOST: /var/run/postgresql
      DB_NAME: tms
      DB_USER: tms_app
      DB_SSL: "off"
      TRUST_PROXY: "true"
      STORAGE_DRIVER: local
      STORAGE_DIR: /data/storage
      BACKUP_MARKER: /backups/last-ok
    volumes:
      - storage:/data/storage
      - db-socket:/var/run/postgresql
      # Read-only, for the health check's view of how old the last backup is.
      - ./backups:/backups:ro
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: mirror.gcr.io/library/caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  backup:
    image: mirror.gcr.io/library/postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    # Still the whole file, for BACKUP_* and the RCLONE_CONFIG_* variables of whatever remote is
    # configured, so this container also holds the app's secrets. See README, "Hardening still to do".
    env_file: .env.production
    environment:
      PGHOST: /var/run/postgresql
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.production}
      PGDATABASE: tms
      PGUSER: tms_app
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
      - storage:/data/storage:ro
      - db-socket:/var/run/postgresql
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
  db-socket:
  storage:
  caddy-data:
  caddy-config:
