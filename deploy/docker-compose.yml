# Threshold on one server: the app, Postgres, Caddy for HTTPS, and nightly backups.
#   cp .env.production.example .env.production   # fill it in
#   docker compose up -d --build
# Run from this deploy/ directory.

name: threshold

# Docker keeps container logs forever by default and they can fill the disk. Every service keeps
# at most 5 files of 10 MB (the local driver also compresses them); `docker compose logs` still works.
x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    logging: *logging
    image: mirror.gcr.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tms
      POSTGRES_USER: tms_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.production}
      # Passwords are checked on the socket too, not trusted. This only applies when the data
      # volume is first created; an existing database keeps its pg_hba.conf (see README).
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
    volumes:
      - db:/var/lib/postgresql/data
      # The app reaches Postgres through its socket, never a port: nothing else can connect.
      - db-socket:/var/run/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tms_app", "-d", "tms"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    logging: *logging
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      DB_DRIVER: postgres
      DB_HOST: /var/run/postgresql
      DB_NAME: tms
      # The owner, for migrations and setting up the roles. The server itself then runs as
      # tms_server with DB_SERVER_PASSWORD (entrypoint.sh).
      DB_USER: tms_app
      DB_SERVER_PASSWORD: ${DB_SERVER_PASSWORD:?set DB_SERVER_PASSWORD in .env.production (see README, Updating)}
      DB_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD:?set DB_BACKUP_PASSWORD in .env.production (see README, Updating)}
      DB_SSL: "off"
      TRUST_PROXY: "true"
      STORAGE_DRIVER: local
      STORAGE_DIR: /data/storage
      BACKUP_MARKER: /backups/last-ok
    volumes:
      - storage:/data/storage
      - db-socket:/var/run/postgresql
      # Read-only, for the health check's view of how old the last backup is.
      - ./backups:/backups:ro
    depends_on:
      db:
        condition: service_healthy

  caddy:
    logging: *logging
    image: mirror.gcr.io/library/caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  backup:
    logging: *logging
    image: mirror.gcr.io/library/postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    # Its own file, BACKUP_* and RCLONE_CONFIG_*, never the app's secrets. Optional: without it
    # backups stay on this server only.
    env_file:
      - path: backup.env
        required: false
    environment:
      PGHOST: /var/run/postgresql
      PGDATABASE: tms
      # Reads everything, writes nothing (see tms/api/scripts/db-roles.mjs).
      PGUSER: tms_backup
      PGPASSWORD: ${DB_BACKUP_PASSWORD:?set DB_BACKUP_PASSWORD in .env.production (see README, Updating)}
      # Only to refuse to run while a remote is still configured in the old place.
      LEGACY_BACKUP_REMOTE: ${BACKUP_REMOTE:-}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
      - storage:/data/storage:ro
      - db-socket:/var/run/postgresql
    depends_on:
      db:
        condition: service_healthy
      # The app creates the tms_backup role on start; backup.sh waits for it.
      app:
        condition: service_started

volumes:
  db:
  db-socket:
  storage:
  caddy-data:
  caddy-config:
