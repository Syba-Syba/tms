service: tms-api

plugins:
  # Handlers are TypeScript and the runtime is not. Without this the package held .ts files and
  # no node_modules at all — npm workspaces hoists every runtime dependency to the repo root,
  # which is outside anything serverless would have zipped — so each function failed at init
  # with Runtime.ImportModuleError.
  - serverless-esbuild

custom:
  esbuild:
    bundle: true
    minify: false
    # Source maps make a stack trace in CloudWatch point at a line of TypeScript.
    sourcemap: true
    target: node20
    platform: node
    # The source is ESM, so the output is too; .mjs keeps Node from reading it as CommonJS.
    format: esm
    outputFileExtension: .mjs
    # pg is CommonJS and requires node builtins internally. In an ESM bundle esbuild replaces
    # those calls with a shim that throws "Dynamic require of events is not supported" the
    # moment the module is loaded. The shim defers to a real `require` if one is in scope, so
    # this puts one there.
    banner:
      js: "import{createRequire as __createRequire}from'module';const require=__createRequire(import.meta.url);"
    exclude:
      # Development-only driver: WebAssembly, tens of megabytes, and lib/db.ts refuses to load
      # it unless NODE_ENV=development, so it must never reach a deployed package.
      - '@electric-sql/pglite'
      # An optional native binding pg probes for and works without.
      - pg-native

provider:
  name: aws
  runtime: nodejs20.x
  region: af-south-1
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 20
  environment:
    NODE_ENV: production
    DB_SECRET_ARN: ${ssm:/tms/${self:provider.stage}/db-secret-arn}
    DB_HOST: ${ssm:/tms/${self:provider.stage}/db-host}
    DB_NAME: tms
    DOCS_BUCKET: ${self:service}-${self:provider.stage}-docs
    KMS_KEY_ID: ${ssm:/tms/${self:provider.stage}/kms-key-id}
    # The bundle is packaged under certs/; LAMBDA_TASK_ROOT is where the package is unpacked.
    RDS_CA_BUNDLE: /var/task/certs/rds-global-bundle.pem
    DB_USER: tms_app
    # The outbox dispatcher read these from an environment that never carried them, so a
    # deployed stage parked every message instead of sending it. Set NOTIFY_MODE=send once a
    # sending domain is verified in SES.
    NOTIFY_MODE: ${ssm:/tms/${self:provider.stage}/notify-mode, 'skip'}
    NOTIFY_FROM: ${ssm:/tms/${self:provider.stage}/notify-from, 'no-reply@example.invalid'}
    # Landlord subscriptions. PayFast needs outbound internet from the VPC (NAT) for the
    # notification check and the subscriptions API. PAYFAST_SANDBOX=true until it goes live.
    BILLING_DRIVER: payfast
    PAYFAST_MERCHANT_ID: ${ssm:/tms/${self:provider.stage}/payfast-merchant-id}
    PAYFAST_MERCHANT_KEY: ${ssm:/tms/${self:provider.stage}/payfast-merchant-key}
    PAYFAST_PASSPHRASE: ${ssm:/tms/${self:provider.stage}/payfast-passphrase}
    PAYFAST_SANDBOX: ${ssm:/tms/${self:provider.stage}/payfast-sandbox, 'true'}
    PUBLIC_APP_URL: ${ssm:/tms/${self:provider.stage}/public-app-url}
    PUBLIC_API_URL: ${ssm:/tms/${self:provider.stage}/public-api-url}
    # WhatsApp is optional: with no token, WhatsApp messages are parked and email still goes.
    WHATSAPP_TOKEN: ${ssm:/tms/${self:provider.stage}/whatsapp-token, ''}
    WHATSAPP_PHONE_NUMBER_ID: ${ssm:/tms/${self:provider.stage}/whatsapp-phone-number-id, ''}
    WHATSAPP_TEMPLATE: ${ssm:/tms/${self:provider.stage}/whatsapp-template, 'threshold_update'}
  # The database sits in a private subnet behind an RDS Proxy, which a Lambda outside the VPC
  # cannot route to at all. Note that attaching a VPC also removes the default route to the
  # internet: Secrets Manager, S3, KMS and SES then need either interface endpoints in that
  # VPC or a NAT gateway.
  vpc:
    securityGroupIds:
      - ${ssm:/tms/${self:provider.stage}/lambda-security-group-id}
    subnetIds: ${ssm:/tms/${self:provider.stage}/private-subnet-ids~split}
  httpApi:
    # The browser SPA and the Capacitor WebView are both cross-origin to the API, and no CORS
    # configuration existed, so every call failed preflight. API Gateway answers OPTIONS itself,
    # ahead of the authorizer, so preflight does not need a token.
    cors:
      allowedOrigins: ${ssm:/tms/${self:provider.stage}/allowed-origins~split}
      allowedHeaders:
        - content-type
        - authorization
      allowedMethods:
        - GET
        - POST
        - PATCH
        - PUT
        - DELETE
        - OPTIONS
      maxAge: 600
    authorizers:
      cognito:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: ${ssm:/tms/${self:provider.stage}/cognito-issuer}
        audience:
          - ${ssm:/tms/${self:provider.stage}/cognito-client-id}
  # Log groups defaulted to never expiring, so every invocation accumulated forever.
  logRetentionInDays: 30
  iam:
    role:
      statements:
        - Effect: Allow
          # DeleteObject is for POPIA erasure and the retention sweep.
          Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
          Resource: arn:aws:s3:::${self:provider.environment.DOCS_BUCKET}/*
        # SSE-KMS on a PutObject is a GenerateDataKey call, not an Encrypt, so uploads were
        # denied by a policy that looked like it covered them.
        - Effect: Allow
          Action: [kms:Encrypt, kms:Decrypt, kms:GenerateDataKey, kms:GenerateDataKey*]
          Resource: '*'
        - Effect: Allow
          Action: [secretsmanager:GetSecretValue]
          Resource: ${self:provider.environment.DB_SECRET_ARN}
        - Effect: Allow
          Action: [ses:SendEmail]
          Resource: '*'


package:
  individually: true
  patterns:
    - '!node_modules/.cache/**'
    - '!**/*.test.ts'
    - '!**/__tests__/**'
    # esbuild emits only the bundle, but these are named explicitly so that a change of
    # packaging cannot quietly ship a developer's credentials, a 40 MB local database or a
    # tenant's signed lease. .pglite and .storage are committed to this repo.
    - '!.env'
    - '!.env.*'
    - '!.pglite/**'
    - '!.storage/**'
    - certs/**

functions:
  # One function serves all 38 routes. Per-route functions meant no single one
  # ever stayed warm at roughly a request a minute, so nearly every call paid a cold start.
  api:
    handler: src/api.handler
    events:
      - httpApi:
          method: '*'
          path: /{proxy+}
          authorizer:
            name: cognito
      # PayFast posts payment notifications with no token. The handler checks the signature,
      # the sender and PayFast's confirmation instead.
      - httpApi:
          method: POST
          path: /billing/notify


  invoicesRun:
    handler: src/handlers/invoices-run.handler
    events:
      - schedule: cron(0 6 25 * ? *)

  interestRun:
    handler: src/handlers/interest-run.handler
    events:
      # Daily: a missed 1st catches up later in the month; a repeat run posts nothing twice.
      - schedule: cron(30 3 * * ? *)

  notificationsDispatch:
    handler: src/handlers/notifications-dispatch.handler
    events:
      - schedule: rate(5 minutes)

  notificationsSweep:
    handler: src/handlers/notifications-sweep.handler
    events:
      - schedule: cron(0 5 * * ? *)

  arrearsRun:
    handler: src/handlers/arrears-run.handler
    events:
      # 05:15 in Johannesburg: reminders land before the working day starts.
      - schedule: cron(15 3 * * ? *)

  leasesActivate:
    handler: src/handlers/leases-activate.handler
    events:
      - schedule: cron(10 3 * * ? *)

  privacySweep:
    handler: src/handlers/privacy-sweep.handler
    events:
      - schedule: cron(30 2 * * ? *)
