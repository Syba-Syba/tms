# Rehearses a restore on the real hosted stack (deploy/drill.sh) whenever the kit, the
# migrations or the scripts the app runs on start change: build, roles, backup, restore check,
# full restore, and a restore that fails part-way and must roll back.
name: Restore drill

on:
  push:
    branches: [main, 'claude/**']
    paths: ['deploy/**', 'tms/db/migrations/**', 'tms/api/scripts/**', '.github/workflows/restore-drill.yml']
  pull_request:
    paths: ['deploy/**', 'tms/db/migrations/**', 'tms/api/scripts/**', '.github/workflows/restore-drill.yml']

concurrency:
  group: drill-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run the restore drill
        run: sh deploy/drill.sh
